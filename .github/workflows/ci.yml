name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  opencode-v2-contracts:
    name: OpenCode V2 Released SDK Contracts
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - run: python3 -B -m unittest discover -s scripts -p test_opencode_v2_host_test.py
      - run: bash scripts/test-opencode-v2-contracts.sh

  installer-module-path:
    name: Installer Module Path Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: bash scripts/test-install-module-path.sh

  go-format:
    name: Go Format
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - run: go run ./internal/gofmtcheck

  unit-tests:
    name: Unit Tests
    needs: go-format
    if: always()
    runs-on: macos-latest
    steps:
      - name: Require successful Go format
        if: needs.go-format.result != 'success'
        run: exit 1
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - name: Test Go packages
        run: |
          umask 022
          go test ./...
      - name: Vet Go packages
        run: go vet ./...
      - name: Test PR policy scripts
        run: node --test .github/scripts/parse-linked-issues.test.cjs .github/scripts/check-pr-size.test.cjs
      - name: Build, vet and test benchmark module
        working-directory: bench
        run: |
          go build -o "$RUNNER_TEMP/gentle-ai-bench" .
          go vet ./...
          go test ./...
      - name: Run benchmark evidence
        run: |
          go build -trimpath -o "$RUNNER_TEMP/gentle-ai" ./cmd/gentle-ai
          "$RUNNER_TEMP/gentle-ai-bench" run --binary "$RUNNER_TEMP/gentle-ai" --out "$RUNNER_TEMP/bench-portable.json"
          jq -e '. as $run | [
            "j51-negotiated-status-correction-continuation",
            "j59-current-status-and-start-ignore-sibling-worktree-transaction",
            "j60-explicit-active-lineage-keeps-four-lens-correction-and-validator-flow",
            "j75-intended-untracked-selection-executes-printed-start",
            "j89-staged-validation-is-informational-and-unmanaged",
            "j104-repository-context-survives-fresh-process",
            "j110-untracked-terminal-burn-and-unmanaged-staged-validation",
            "j111-approved-transaction-burns-and-shipped-gates-are-unmanaged",
            "j113-correction-removes-candidate-only-path",
            "j114-last-reviewer-capture-closes-and-burns",
            "j116-codex-committed-correction-runs-returned-status-continuation",
            "j123-rejected-provider-validator-starts-fresh-high-risk-review",
            "j4435-selected-untracked-correction-continuation-is-selectorless"
          ] | all(.[]; . as $id | ([$run.journeys[] | select(.id == $id)] | length) == 1 and ([$run.journeys[] | select(.id == $id and .status == "completed")] | length) == 1)' "$RUNNER_TEMP/bench-portable.json"
          "$RUNNER_TEMP/gentle-ai-bench" run --binary "$RUNNER_TEMP/gentle-ai" --only j105-compiled-provider-capture-retries-same-binding --out "$RUNNER_TEMP/bench-provider-capture.json"
          jq -e '[.journeys[] | select(.id == "j105-compiled-provider-capture-retries-same-binding")] | length == 1 and .[0].status == "completed"' "$RUNNER_TEMP/bench-provider-capture.json"
          "$RUNNER_TEMP/gentle-ai-bench" run --binary "$RUNNER_TEMP/gentle-ai" --axis transition --out "$RUNNER_TEMP/bench-transition.json"
          jq -e '([.journeys[] | select(.id | startswith("tr"))] | length) == 1 and ([.journeys[] | select(.id == "tr09-mode-flip-while-a-review-lineage-is-open")] | length) == 1 and ([.journeys[] | select(.id == "tr09-mode-flip-while-a-review-lineage-is-open")][0].status == "completed")' "$RUNNER_TEMP/bench-transition.json"
          "$RUNNER_TEMP/gentle-ai-bench" run --binary "$RUNNER_TEMP/gentle-ai" --axis model-picker --only j97-opencode-custom-agent-model-picker-runtime --out "$RUNNER_TEMP/bench-model-picker-untagged.json"
          jq -e '[.journeys[] | select(.id == "j97-opencode-custom-agent-model-picker-runtime")] | length == 1 and .[0].status == "unsupported"' "$RUNNER_TEMP/bench-model-picker-untagged.json"
          go build -tags bench_fixture -trimpath -o "$RUNNER_TEMP/gentle-ai-bench-fixture" ./cmd/gentle-ai
          "$RUNNER_TEMP/gentle-ai-bench" run --binary "$RUNNER_TEMP/gentle-ai-bench-fixture" --axis model-picker --only j97-opencode-custom-agent-model-picker-runtime --out "$RUNNER_TEMP/bench-model-picker.json"
          jq -e '[.journeys[] | select(.id == "j97-opencode-custom-agent-model-picker-runtime")] | length == 1 and .[0].status == "completed"' "$RUNNER_TEMP/bench-model-picker.json"
      - name: Check for new unreachable functions
        run: ./scripts/deadcode-ratchet.sh
      - name: Run deterministic cross-lane integration
        run: bash scripts/cross-lane-battery.sh --binary "$RUNNER_TEMP/gentle-ai"

  darwin-runtime:
    name: Darwin Runtime
    needs: go-format
    if: always()
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Require successful Go format
        if: needs.go-format.result != 'success'
        run: exit 1
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Verify manifest against existing tests
        run: ./scripts/darwin-release-blockers.sh verify
      - name: Run Darwin release-blocker tests
        timeout-minutes: 20
        run: |
          umask 022
          ./scripts/darwin-release-blockers.sh run

  organic-runtime-e2e:
    name: Organic Runtime E2E (macOS)
    needs: go-format
    if: always()
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Require successful Go format
        if: needs.go-format.result != 'success'
        run: exit 1
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - name: Install real agent runtimes
        run: |
          npm install --global opencode-ai@1.18.10
          npm install --global @anthropic-ai/claude-code@latest
      - name: Require registered real-agent detection
        run: go test -tags real_agent_e2e -list '^TestOrganicConfiguredAgentReceivesRoutingGuidanceRealAgents$' ./e2e/organicruntime | grep -x TestOrganicConfiguredAgentReceivesRoutingGuidanceRealAgents
      - name: Run organic journeys
        env:
          GENTLE_AI_REAL_AGENT_E2E: '1'
        run: go test -tags real_agent_e2e -v ./e2e/organicruntime -count=1 -timeout=25m
